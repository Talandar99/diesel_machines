[entity-description]
diesel-fast-inserter=Powered by a crude diesel engine, it moves much faster than its standard electric counterpart. Works off-grid, but requires a constant supply of liquid fuel.
diesel-long-handed-inserter=A fuel-powered inserter with extended reach. Operates independently of the electric grid as long as its diesel engine is fed.
diesel-extra-long-handed-inserter=Mighty diesel engine allows this inserter to swing its exceptionally long, heavy mechanical arm. Reaches much further than standard inserters. Ignores the electric grid entirely, provided it has a steady supply of liquid fuel.
diesel-cargo-bulk-inserter=A heavy-duty, fuel-powered inserter designed for cargo bulk handling. Easily moves entire stacks in a single grab.\nPerfect for unloading ships or transferring items between large storage containers.
diesel-cargo-stack-inserter=A heavy-duty, fuel-powered inserter built for extreme throughput. Capable of stacking items directly onto transport belts without needing a single spark of electricity.

diesel-assembling-machine=Built around a heavy-duty central diesel engine, this unit bridges the gap between crude mechanical force and complex assembly. It operates reliably off-grid, requiring only liquid fuel to keep its precise gears turning.

diesel-pump=A robust inline pump powered by liquid fuel. Transfers fluids rapidly without relying on electricity, making it ideal for remote, off-grid pipeline networks.
diesel-offshore-pump=Draws water or other environmental fluids using a reliable, heavy-duty diesel engine. Perfect for establishing off-grid fluid extraction outposts.
diesel-miner=A roaring engine of ruthless extraction. This colossal unit violently tears through ore patches by brute-forcing the digging process. It prioritizes massive, immediate yield over conservation, completely discarding the resource drain reduction relied upon by weaker electric counterparts.

diesel-asteroid-collector=A fuel-powered asteroid collector built for stationary outposts. Casting aside multi-arm efficiency, it relies on a single arm with massively extended reach. It sweeps the darkest depths of space, dragging distant asteroids back to the platform.
diesel-agricultural-tower=Plants and harvests flora using a towering crane and crude diesel power. Eliminates the need for electrical poles in your fields, provided you can keep its engine fueled.


