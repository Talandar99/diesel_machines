[technology-description]
diesel-automation=Enables fuel-powered machines that run on liquid fuels instead of electricity. Allows off-grid automation but requires constant fuel supply.
portable-diesel-generator=A reinforced portable diesel core designed for the harsh environments. When fed barrels of fuel, it overwhelms even the Fission Reactor’s output.

